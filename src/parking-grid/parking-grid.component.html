<div class="parking">
    <div class="page-header">
        <div>
            <h1 class="page-title">Parking Grid</h1>
            <p class="page-sub">Click a slot to book or manage</p>
        </div>
        <div class="toolbar">
            <input class="search-input" type="text" placeholder="Search by plate..." />
            <app-custom-select [options]="optionsData" label="All Slots" />
            <app-custom-select [options]="optionsType" label="All Types" />
        </div>
    </div>
    <!-- Legend -->
    <div class="legend">
        <div class="legend__item">
            <div class="slot slot--sm slot--available"></div> Available
        </div>
        <div class="legend__item">
            <div class="slot slot--sm slot--occupied"></div> Occupied
        </div>
        <div class="legend__item">
            <div class="slot slot--sm slot--reserved"></div> Reserved
        </div>
        <div class="legend__item">
            <div class="slot slot--sm slot--maintenance"></div> Maintenance
        </div>
        <div class="legend__item">
            <div class="slot slot--sm slot--ev"></div> EV Charging
        </div>
    </div>

    <!-- Floor tabs -->
    <div class="floor-tabs">
        @for (floor of parkingFloors(); track floor.number) {
        <button class="floor-tab" [class.floor-tab--active]="activeParkingFloor() === floor.number"
            (click)="setParkingFloor(floor.number)">
            {{ floor.label }}
            <span class="floor-tab__count">
                {{ parkingFloorAvailable(floor.number) }}/{{ floor.slots.length }}
            </span>
        </button>
        }
    </div>

</div>
